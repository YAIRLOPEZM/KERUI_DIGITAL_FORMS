<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>KERUI DIGITAL FORMS</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/historial.css') }}">

</head>

<body>

<div class="encabezado">

    <div>

        <div class="titulo">
            KERUI DIGITAL FORMS
        </div>

        <div class="subtitulo">
            Centro de Control de Órdenes de Mantenimiento
        </div>

    </div>

</div>

<div class="contenedor">

<div class="barra-superior">

    <a href="/" class="btn">
        ➕ Nueva Orden
    </a>

    <a href="/historial/exportar" class="btn">
        📊 Exportar a Excel
    </a>

    <input
        class="buscar"
        placeholder="Buscar una Orden...">

</div>

<table>

<tr>

    <th>Orden</th>

    <th>Fecha</th>

    <th>Técnico</th>

    <th>Equipo</th>

    <th>Estado</th>

    <th>Acciones</th>

</tr>

{% for orden in ordenes %}

<tr>

    <td>{{ orden[1] }}</td>

    <td>{{ orden[2] }}</td>

    <td>{{ orden[3] }} {{ orden[4] }}</td>

    <td>{{ orden[5] }}</td>

    <td>{{ orden[6] }}</td>

    <td class="acciones">

    <a href="/orden/{{ orden[1] }}" title="Ver resumen">👁</a>

    <a href="/pdf-descarga/{{ orden[1] }}" target="_blank" title="Ver PDF">📄</a>

    <form
        method="POST"
        action="/orden/{{ orden[1] }}/eliminar"
        class="form-eliminar"
        onsubmit="return confirm('¿Eliminar la orden {{ orden[1] }}? Esta acción no se puede deshacer.');">
        <button type="submit" class="btn-eliminar" title="Eliminar">🗑</button>
    </form>

    </td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
