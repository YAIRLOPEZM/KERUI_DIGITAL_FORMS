<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} - {{ orden.numero_ot }}</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 16px;
        }
        .caja {
            max-width: 560px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 0 15px rgba(0,0,0,.15);
        }
        h1 {
            font-size: 18px;
            margin-bottom: 4px;
        }
        .subtitulo {
            font-size: 13px;
            color: #666;
            margin-bottom: 18px;
        }
        table.resumen {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 13px;
        }
        table.resumen td {
            border: 1px solid #ddd;
            padding: 6px 8px;
        }
        table.resumen td.etiqueta {
            background: #E8E8E8;
            font-weight: bold;
            width: 40%;
        }
        .pdf-link {
            display: inline-block;
            margin-bottom: 18px;
            font-size: 13px;
        }
        canvas {
            border: 2px solid #333;
            border-radius: 6px;
            width: 100%;
            height: 180px;
            touch-action: none;
        }
        .botones {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        button, .boton {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-limpiar {
            background: #eee;
            color: #333;
        }
        .btn-firmar {
            background: #1a7a3a;
            color: white;
        }
    </style>
</head>
<body>

    <div class="caja">

        <h1>{{ titulo }}</h1>
        <div class="subtitulo">Orden de mantenimiento {{ orden.numero_ot }}</div>

        <a class="pdf-link" href="/pdf-descarga/{{ orden.numero_ot }}" target="_blank">
            📄 Ver PDF con lo diligenciado hasta ahora
        </a>

        <table class="resumen">
            <tr>
                <td class="etiqueta">Descripción</td>
                <td>{{ orden.descripcion_orden }}</td>
            </tr>
            <tr>
                <td class="etiqueta">Equipo</td>
                <td>{{ orden.equipo }}</td>
            </tr>
            <tr>
                <td class="etiqueta">Ubicación técnica</td>
                <td>{{ orden.ubicacion }}</td>
            </tr>
            <tr>
                <td class="etiqueta">Técnico ejecutante</td>
                <td>{{ orden.nombre }} {{ orden.apellidos }}</td>
            </tr>
            <tr>
                <td class="etiqueta">Fecha</td>
                <td>{{ orden.fecha }}</td>
            </tr>
        </table>

        <form method="POST" id="formAprobar">

            <label style="font-size:13px; font-weight:bold;">Firma:</label>
            <canvas id="firmaCanvas"></canvas>

            <input type="hidden" name="firma" id="firma">

            <div class="botones">
                <button type="button" class="btn-limpiar" id="limpiar">Limpiar</button>
                <button type="submit" class="btn-firmar">Firmar y aprobar</button>
            </div>

        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <script>
        const canvas = document.getElementById("firmaCanvas");
        const pad = new SignaturePad(canvas);

        function ajustarCanvas() {
            const ratio = Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            canvas.getContext("2d").scale(ratio, ratio);
            pad.clear();
        }
        window.addEventListener("resize", ajustarCanvas);
        ajustarCanvas();

        document.getElementById("limpiar").addEventListener("click", function () {
            pad.clear();
        });

        document.getElementById("formAprobar").addEventListener("submit", function (evento) {
            if (pad.isEmpty()) {
                evento.preventDefault();
                alert("Por favor firma antes de continuar.");
                return;
            }
            document.getElementById("firma").value = pad.toDataURL();
        });
    </script>

</body>
</html>
