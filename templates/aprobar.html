<div class="caja">

        <h1>{{ titulo }}</h1>
        <div class="subtitulo">Orden de mantenimiento {{ orden.numero_ot }}</div>

        <a class="pdf-link" href="/pdf-descarga/{{ orden.numero_ot }}" target="_blank">
            📄 Ver PDF con lo diligenciado hasta ahora
        </a>

        <table class="resumen">
            <tr>
                <td class="etiqueta">Descripción</td>
                <td>{{ orden.descripcion_orden }}</td>
            </tr>
            <tr>
                <td class="etiqueta">Equipo</td>
                <td>{{ orden.equipo }}</td>
            </tr>
            <tr>
                <td class="etiqueta">Ubicación técnica</td>
                <td>{{ orden.ubicacion }}</td>
            </tr>
            <tr>
                <td class="etiqueta">Técnico ejecutante</td>
                <td>{{ orden.nombre }} {{ orden.apellidos }}</td>
            </tr>
            <tr>
                <td class="etiqueta">Fecha</td>
                <td>{{ orden.fecha }}</td>
            </tr>
        </table>

        <form method="POST" id="formAprobar">

            <label style="font-size:13px; font-weight:bold;">Firma:</label>
            <canvas id="firmaCanvas"></canvas>

            <input type="hidden" name="firma" id="firma">

            <!-- NUEVO: alternativa de subir una imagen de firma ya guardada -->
            <input type="file" id="archivoFirma" accept="image/*" style="display:none;">

            <div class="botones">
                <button type="button" class="btn-limpiar" id="limpiar">Limpiar</button>
                <button type="button" class="btn-limpiar" id="btnSubirFirma">🖼️ Subir imagen de firma</button>
                <button type="submit" class="btn-firmar">Firmar y aprobar</button>
            </div>

        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <script>
        const canvas = document.getElementById("firmaCanvas");
        const pad = new SignaturePad(canvas);

        function ajustarCanvas() {
            const ratio = Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            canvas.getContext("2d").scale(ratio, ratio);
            pad.clear();
        }
        window.addEventListener("resize", ajustarCanvas);
        ajustarCanvas();

        document.getElementById("limpiar").addEventListener("click", function () {
            pad.clear();
        });

        // ==========================================
        // NUEVO: subir una imagen de firma ya existente
        // ==========================================

        const btnSubirFirma = document.getElementById("btnSubirFirma");
        const archivoFirma = document.getElementById("archivoFirma");

        btnSubirFirma.addEventListener("click", function () {
            archivoFirma.click();
        });

        archivoFirma.addEventListener("change", function (evento) {
            const archivo = evento.target.files[0];
            if (!archivo) return;

            if (!archivo.type.startsWith("image/")) {
                alert("Por favor selecciona un archivo de imagen (PNG o JPG).");
                return;
            }

            const lector = new FileReader();

            lector.onload = function (e) {
                const imagen = new Image();

                imagen.onload = function () {
                    const ratio = Math.max(window.devicePixelRatio || 1, 1);
                    const anchoCanvas = canvas.width / ratio;
                    const altoCanvas = canvas.height / ratio;

                    // Mantiene la proporción de la imagen y la centra
                    // dentro del espacio del canvas, sin deformarla.
                    const escala = Math.min(
                        anchoCanvas / imagen.width,
                        altoCanvas / imagen.height
                    );
                    const anchoDestino = imagen.width * escala;
                    const altoDestino = imagen.height * escala;
                    const x = (anchoCanvas - anchoDestino) / 2;
                    const y = (altoCanvas - altoDestino) / 2;

                    pad.clear();
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(imagen, x, y, anchoDestino, altoDestino);

                    // Le avisamos a signature_pad que este es el nuevo
                    // contenido, para que isEmpty() y toDataURL() lo
                    // reconozcan igual que si se hubiera dibujado a mano.
                    pad.fromDataURL(canvas.toDataURL());
                };

                imagen.src = e.target.result;
            };

            lector.readAsDataURL(archivo);
        });

        document.getElementById("formAprobar").addEventListener("submit", function (evento) {
            if (pad.isEmpty()) {
                evento.preventDefault();
                alert("Por favor firma o sube una imagen de firma antes de continuar.");
                return;
            }
            document.getElementById("firma").value = pad.toDataURL();
        });
    </script>

</body>
</html>
