<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orden {{ numero_ot }} - KERUI DIGITAL FORMS</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 16px;
        }
        .caja {
            max-width: 480px;
            margin: 60px auto;
            background: white;
            border-radius: 10px;
            padding: 26px;
            box-shadow: 0 0 15px rgba(0,0,0,.15);
            text-align: center;
        }
        p {
            font-size: 14px;
            color: #333;
        }
        .caja-link {
            margin-top: 20px;
            padding: 14px;
            background: #f5f5f5;
            border-radius: 8px;
            text-align: left;
        }
        .caja-link label {
            font-size: 13px;
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
        }
        .caja-link input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .boton {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 20px;
            background: #0078D4;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="caja">

        <p>{{ mensaje }}</p>

        {% if siguiente_link %}
        <div class="caja-link">
            <label>Enlace para el Coordinador de Operaciones:</label>
            <input type="text" readonly value="{{ siguiente_link }}" onclick="this.select()">
        </div>
        {% endif %}

        {% if pdf_link %}
        <a class="boton" href="{{ pdf_link }}" target="_blank">Ver PDF final</a>
        {% endif %}

    </div>

</body>
</html>
