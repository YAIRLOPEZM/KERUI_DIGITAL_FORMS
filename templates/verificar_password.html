<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>KERUI DIGITAL FORMS</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/estilos.css') }}">

</head>

<body>

<div class="hoja" style="max-width: 400px; margin: 60px auto; text-align: center;">

    <h2>Acceso de supervisor requerido</h2>

    <p>Para editar la orden <strong>{{ numero_ot }}</strong> ingresa la contraseña de supervisor.</p>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <input type="password" name="password" required autofocus
               style="padding:8px; width:100%; box-sizing:border-box; margin-bottom:10px;">
        <button type="submit" class="btn-guardar">Ingresar</button>
    </form>

</div>

</body>

</html>
